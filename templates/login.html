{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card p-4 shadow-sm" style="max-width:480px;margin:0 auto;">
    <h2 class="mb-3">Войти</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>
    <p class="mt-3 text-muted">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</div>
{% endblock %}
