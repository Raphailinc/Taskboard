{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card p-4 shadow-sm" style="max-width:480px;margin:0 auto;">
    <h2 class="mb-3">Регистрация</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Создать аккаунт</button>
    </form>
    <p class="mt-3 text-muted">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</div>
{% endblock %}
