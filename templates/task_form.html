{% extends "base.html" %}
{% block title %}{{ form.instance.pk|yesno:"Редактировать,Создать" }} задачу{% endblock %}
{% block content %}
<div class="card p-4 shadow-sm">
    <h2 class="mb-3">{{ form.instance.pk|yesno:"Редактировать,Создать" }} задачу</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Сохранить</button>
        <a class="btn btn-link" href="{% url 'task_list' %}">Отмена</a>
    </form>
</div>
{% endblock %}
